[project]
name = "seamjax"
version = "0.1.0"
description = "Seam: a non-Euclidean roguelike twin-stick shooter, simulated and generated in JAX (playable, with Gymnasium environments)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax",
    "numpy",
    "gymnasium>=1.0",
    "pygame>=2.1.3",
    "moderngl",
]

[project.optional-dependencies]
# JAX backends (pick at most one; seamjax.backend then uses it automatically, see README)
cuda = ["jax[cuda13]; sys_platform == 'linux'"]                       # NVIDIA, CUDA 13 driver (Linux x86_64 / aarch64)
cuda12 = ["jax[cuda12]; sys_platform == 'linux'"]                     # NVIDIA, older CUDA 12 driver
rocm = ["jax[rocm7-local]; sys_platform == 'linux' and platform_machine == 'x86_64'"]   # AMD; ROCm 7 must already be installed on the machine
metal = ["metaljax; sys_platform == 'darwin' and platform_machine == 'arm64'"]          # Apple silicon GPU; experimental community plugin
tools = ["pillow"]            # only for saving images (render.save_png, tools/render_samples.py)
parity = ["playwright"]       # only for tests/reference/export_pool.py (JS parity data)

[project.scripts]
seam = "seamjax.play:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seamjax"]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "cuda12" }, { extra = "rocm" }, { extra = "metal" }]]
